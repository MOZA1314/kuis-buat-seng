<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Kesopanan & Empati Hubungan 💬✨</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.9);
            outline: none;
            border-color: #ec4899;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.3);
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Container Utama -->
    <div class="w-full max-full max-w-2xl">
        
        <!-- HEADER / BANNER -->
        <div class="glass-card rounded-3xl p-6 mb-6 text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 flex items-center justify-center gap-2">
                <span>💌</span> Deep Talk & Empati
            </h1>
            <p class="text-gray-600 text-sm mt-1">10 Pertanyaan Random! Jawab dari hati ya, sayang~ ✨</p>
        </div>

        <!-- SCREEN 1: START / INPUT NAMA -->
        <div id="startScreen" class="glass-card rounded-3xl p-8 fade-in text-center">
            <div class="text-5xl mb-4">✨🌸</div>
            <h2 class="text-xl font-semibold text-gray-800 mb-2">Sebelum Mulai...</h2>
            <p class="text-sm text-gray-600 mb-6">Tulis nama atau panggilan kesayanganmu di bawah ini ya!</p>
            
            <input type="text" id="userName" placeholder="Nama / Panggilan kamu..." 
                   class="glass-input w-full p-4 rounded-2xl text-gray-800 text-center text-lg font-medium mb-6">
            
            <button onclick="startQuiz()" 
                    class="w-full bg-gradient-to-r from-pink-500 to-rose-400 text-white font-semibold py-4 rounded-2xl shadow-lg hover:opacity-90 transition transform hover:-translate-y-0.5">
                Mulai Jawab Kuis 💕
            </button>
        </div>

        <!-- SCREEN 2: QUIZ ESSAY -->
        <div id="quizScreen" class="glass-card rounded-3xl p-6 md:p-8 fade-in hidden">
            <!-- Progress Bar & Indicator -->
            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <span id="questionCounter" class="text-xs md:text-sm font-semibold text-pink-700 bg-pink-100/70 px-3 py-1 rounded-full">
                        Pertanyaan 1 dari 10
                    </span>
                    <span id="savedStatus" class="text-xs text-gray-500 italic">✨ Auto-saved</span>
                </div>
                <div class="w-full bg-white/50 h-2.5 rounded-full overflow-hidden">
                    <div id="progressBar" class="bg-gradient-to-r from-pink-500 to-rose-400 h-full transition-all duration-300 w-0"></div>
                </div>
            </div>

            <!-- Question Box -->
            <div class="mb-6">
                <h3 id="questionText" class="text-base md:text-lg font-semibold text-gray-800 leading-relaxed mb-4">
                    <!-- Teks Pertanyaan Muncul di Sini -->
                </h3>
                
                <textarea id="essayAnswer" rows="5" 
                          placeholder="Tulis jawaban lengkapmu di sini..." 
                          class="glass-input w-full p-4 rounded-2xl text-gray-800 text-sm md:text-base leading-relaxed resize-none"></textarea>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex gap-4">
                <button id="btnPrev" onclick="prevQuestion()" 
                        class="w-1/3 bg-white/70 hover:bg-white text-gray-700 font-semibold py-3.5 rounded-2xl border border-white transition disabled:opacity-40">
                    ⬅️ Kembali
                </button>
                <button id="btnNext" onclick="nextQuestion()" 
                        class="w-2/3 bg-gradient-to-r from-pink-500 to-rose-400 text-white font-semibold py-3.5 rounded-2xl shadow-md hover:opacity-90 transition">
                    Lanjut ➡️
                </button>
            </div>
        </div>

        <!-- SCREEN 3: RESULT / SUMMARY -->
        <div id="resultScreen" class="glass-card rounded-3xl p-6 md:p-8 fade-in hidden">
            <div class="text-center mb-6">
                <div class="text-5xl mb-2">🎉💖</div>
                <h2 class="text-2xl font-bold text-gray-800">Selesai! Terima Kasih Ya!</h2>
                <p class="text-sm text-gray-600 mt-1">Semua jawabanmu udah tersimpan rapi.</p>
            </div>

            <!-- Summary List -->
            <div id="summaryList" class="max-h-72 overflow-y-auto pr-2 space-y-4 mb-6 text-sm text-gray-800">
                <!-- Rangkuman Jawaban Muncul di Sini -->
            </div>

            <!-- Action Buttons -->
            <div class="space-y-3">
                <button onclick="sendToWhatsApp()" 
                        class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 transition">
                    <span>💬</span> Kirim Jawaban ke WhatsApp
                </button>
                <button onclick="resetQuiz()" 
                        class="w-full bg-white/60 hover:bg-white text-gray-600 font-medium py-3 rounded-2xl transition">
                    🔄 Acak Ulang 10 Pertanyaan Baru
                </button>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // Kumpulan 50 Pertanyaan Random
        const allQuestionsPool = [
            "Pasanganmu lagi cerita panjang lebar tentang hari yang buruk, tapi kamu lagi asyik main game/nonton. Apa yang biasanya kamu lakukan?",
            "Kalau kita janjian ketemu jam 4 sore tapi kamu ada urusan mendadak dan bakal telat, gimana caramu ngabarin dan menyikapinya?",
            "Pasanganmu masak atau bawain makanan buat kamu tapi rasanya kurang cocok di lidahmu. Gimana reaksimu?",
            "Kalau pasanganmu mau pinjam HP kamu sebentar buat cek sesuatu karena baterainya habis, apa yang kamu rasakan dan lakukan?",
            "Pasanganmu potong rambut dengan gaya baru tapi kamu kurang suka. Pas dia nanya pendapatmu, kamu bakal jawab apa?",
            "Kalau kita lagi beda pendapat dan suasananya mulai panas/emosi, gimana caramu meredakan suasana?",
            "Pasanganmu lagi kumpul sama teman-temannya dan respon chat-nya agak lama. Gimana perasaan dan tindakanmu?",
            "Kalau kamu tanpa sengaja lupa janji kecil yang udah kita bikin, gimana caramu minta maaf dan memperbaikinya?",
            "Waktu lagi di tempat umum dan pasanganmu nggak sengaja ngelakuin hal memalukan (misal kesandung), apa reaksi pertamamu?",
            "Saat pasanganmu cerita antusias soal hobinya yang jujur kamu kurang paham, gimana cara kamu mendengarkannya?",
            "Kalau kamu lagi capek banget habis nugas/kerja terus pasanganmu ngajak jalan, gimana caramu menolak atau memberi pengertian?",
            "Bagaimana pendapatmu kalau pasanganmu mau beli barang pakai uangnya sendiri tapi menurutmu harganya kemahalan?",
            "Gimana batas yang kamu tetapkan kalau ada teman lawan jenis yang sering chat kamu buat hal-hal di luar urusan penting?",
            "Kalau kita lagi nonton film pilihan pasanganmu tapi kamu ngerasa ngantuk/bosan banget, kamu bakal bilang apa?",
            "Pasanganmu nggak sengaja numpahin minuman ke pakaian/barang kesayanganmu. Gimana respon spontanmu?",
            "Kalau pasanganmu ngajak makan di tempat yang kamu lagi nggak pengen banget, gimana caramu mengusulkan alternatif?",
            "Kalau di tempat tongkrongan ada temanmu yang bikin lelucon yang bikin pasanganmu nggak nyaman, apa yang bakal kamu lakukan?",
            "Gimana reaksimu kalau pasanganmu ngirim meme/video/TikTok yang menurutmu garing atau nggak lucu?",
            "Kalau pasanganmu bilang 'Aku butuh waktu sendiri (space) dulu ya', gimana kamu meresponsnya?",
            "Kalau pasanganmu sakit tapi di saat yang sama kamu ada jadwal kumpul sama temen-temen yang udah direncanain lama, kamu milih yang mana?",
            "Mantan tiba-tiba nge-chat nanyain kabar atau hal basa-basi. Apa yang bakal kamu lakuin?",
            "Pasanganmu ngasih kado yang jujur aja kamu nggak butuh atau nggak suka. Apa reaksimu saat menerimanya?",
            "Kamu ketahuan berbohong untuk hal sepele (white lie) biar pasangan nggak marah. Waktu ketahuan, apa yang bakal kamu jelaskan?",
            "Gimana responmu kalau pasangan tiba-tiba cemburu buta tanpa alasan yang jelas?",
            "Kalian lagi di jalan kehujanan atau kepanasan banget padahal baru dandan rapi. Gimana caramu menjaga mood kalian berdua?",
            "Keuanganmu lagi mepet banget bulan ini, tapi pasanganmu pengen banget diajak makan di tempat yang lumayan mahal. Kamu bakal bilang apa?",
            "Kalau pasanganmu lagi insecure dan ngeluh soal berat badan atau bentuk fisiknya, kalimat apa yang bakal kamu ucapin buat nenangin dia?",
            "Kamu nggak sengaja kelupaan tanggal penting (misal anniversary atau ulang tahun). Apa yang kamu lakukan buat menebus kesalahan itu?",
            "Pasangan minta diajarin sesuatu (misal pelajaran atau main game) tapi dia agak lambat pahamnya. Gimana caramu bersabar?",
            "Gimana reaksimu kalau ternyata keluarga pasangan terlihat kurang welcome atau dingin ke kamu saat pertama ketemu?",
            "Kamu nemuin barang milik pasangan yang tertinggal di rumahmu/tasmu. Apa yang bakal kamu lakuin?",
            "Pasangan tiba-tiba nangis di depanmu tanpa ngasih tahu alasannya. Apa tindakan pertamamu?",
            "Waktu berantem, pasangan milih diam seribu bahasa (silent treatment). Gimana caramu menghadapi situasi ini?",
            "Pasangan nggak sengaja merusak barang koleksi atau barang kesayanganmu. Gimana caramu mengatur emosi saat itu?",
            "Kamu tahu kalau salah satu teman dekatmu menjelek-jelekkan pasanganmu di belakangnya. Apa yang bakal kamu lakukan?",
            "Kalau pasangan membanding-bandingkan hubungan kalian dengan hubungan orang lain di sosmed, apa yang bakal kamu katakan kepadanya?",
            "Kamu lagi overthinking dan butuh dukungan moral, tapi pasanganmu lagi sibuk banget sama urusannya. Apa yang kamu rasakan dan lakukan?",
            "Kalian lagi di jalan jauh bareng, tapi selera musik kalian beda parah. Gimana cara kalian kompromi soal playlist?",
            "Gimana pendapatmu kalau pasangan meminta akses password sosial media kamu?",
            "Pasanganmu sering banget telat tiap kali janjian ketemu. Gimana caramu menegurnya pelan-pelan tanpa bikin berantem?",
            "Kalian lagi jalan-jalan liburan berdua tapi malah nyasar dan bingung jalan. Reaksimu bakal panik nyalahin keadaan atau gimana?",
            "Pasanganmu upload foto kalian berdua, tapi menurutmu muka kamu kelihatan jelek/nggak banget di foto itu. Kamu bakal minta hapus atau biarin aja?",
            "Pasanganmu menceritakan rahasia besar tentang temannya ke kamu. Apakah kamu bisa menjaga rahasia itu atau malah ikut ceritain ke temanmu yang lain?",
            "Kalau kamu ngerasa akhir-akhir ini pasanganmu kurang ngasih perhatian, gimana caramu menyampaikannya tanpa terdengar menuntut?",
            "Pasangan minta ditemenin keliling mall/belanja berjam-jam padahal kamu lagi capek banget. Gimana reaksimu?",
            "Gimana caramu menyikapi perbedaan pendapat kalau yang satu lebih suka hemat, dan yang satu agak boros/suka jajan?",
            "Kalau pasangan nggak sengaja membaca chat pribadi kamu sama sahabatmu dan dia salah paham, gimana caramu menjelaskannya?",
            "Pasangan menuntut kamu buat mengubah gaya berpakaian atau kebiasaanmu. Apa kamu akan menuruti atau mempertahankan jati dirimu?",
            "Apa definisi 'Cinta yang Sehat' menurut kamu untuk saat ini?",
            "Tuliskan pesan manis, harapan jujur, atau apresiasi kamu untuk hubungan kita ke depannya! 💕"
        ];

        let selectedQuestions = [];
        let currentQuestion = 0;
        let answers = [];
        let userName = localStorage.getItem('quiz_user_name') || '';

        // Fungsi mengacak array (Fisher-Yates Shuffle)
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Auto Save Listener
        document.getElementById('essayAnswer').addEventListener('input', function(e) {
            answers[currentQuestion] = e.target.value;
            localStorage.setItem('quiz_essay_answers', JSON.stringify(answers));
        });

        function initQuizData() {
            // Cek apakah ada sesi kuis yang tersimpan
            let savedQuestions = localStorage.getItem('quiz_selected_questions');
            let savedAnswers = localStorage.getItem('quiz_essay_answers');

            if (savedQuestions && savedAnswers) {
                // Lanjutkan sesi sebelumnya
                selectedQuestions = JSON.parse(savedQuestions);
                answers = JSON.parse(savedAnswers);
            } else {
                // Buat 10 soal random baru jika tidak ada sesi tersimpan
                let shuffled = shuffleArray(allQuestionsPool);
                selectedQuestions = shuffled.slice(0, 10);
                answers = new Array(10).fill('');
                
                // Simpan soal terpilih ke lokal agar aman dari refresh
                localStorage.setItem('quiz_selected_questions', JSON.stringify(selectedQuestions));
                localStorage.setItem('quiz_essay_answers', JSON.stringify(answers));
            }
        }

        function startQuiz() {
            const inputName = document.getElementById('userName').value.trim();
            if (!inputName) {
                alert('Isi nama atau panggilan kamu dulu ya! 😊');
                return;
            }
            userName = inputName;
            localStorage.setItem('quiz_user_name', userName);

            initQuizData(); // Load atau buat soal random
            
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            document.getElementById('questionCounter').innerText = `Pertanyaan ${currentQuestion + 1} dari 10`;
            
            // Tambahkan nomor soal secara dinamis ke teks pertanyaan
            document.getElementById('questionText').innerText = `${currentQuestion + 1}. ${selectedQuestions[currentQuestion]}`;
            
            document.getElementById('essayAnswer').value = answers[currentQuestion] || '';

            // Update Progress Bar
            const progress = ((currentQuestion + 1) / 10) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;

            // Update Buttons
            document.getElementById('btnPrev').disabled = (currentQuestion === 0);
            
            const btnNext = document.getElementById('btnNext');
            if (currentQuestion === 9) { // Pertanyaan ke-10 (index 9)
                btnNext.innerText = 'Selesai & Lihat Hasil ✨';
            } else {
                btnNext.innerText = 'Lanjut ➡️';
            }
        }

        function nextQuestion() {
            // Save current answer
            answers[currentQuestion] = document.getElementById('essayAnswer').value;
            localStorage.setItem('quiz_essay_answers', JSON.stringify(answers));

            if (currentQuestion < 9) {
                currentQuestion++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                answers[currentQuestion] = document.getElementById('essayAnswer').value;
                localStorage.setItem('quiz_essay_answers', JSON.stringify(answers));
                currentQuestion--;
                loadQuestion();
            }
        }

        function showResults() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');

            const summaryList = document.getElementById('summaryList');
            summaryList.innerHTML = '';

            selectedQuestions.forEach((q, idx) => {
                const item = document.createElement('div');
                item.className = 'p-4 rounded-2xl bg-white/40 border border-white/60';
                item.innerHTML = `
                    <p class="font-medium text-gray-900 text-xs md:text-sm mb-1">${idx + 1}. ${q}</p>
                    <p class="text-pink-900 bg-pink-50/70 p-3 rounded-xl border border-pink-100 italic text-xs md:text-sm">
                        "${answers[idx] || 'Tidak diisi'}"
                    </p>
                `;
                summaryList.appendChild(item);
            });
        }

        function sendToWhatsApp() {
            let message = `*Hasil Kuis Deep Talk & Empati* 💌\n`;
            message += `*Nama:* ${userName}\n`;
            message += `----------------------------------------\n\n`;

            selectedQuestions.forEach((q, idx) => {
                message += `*${idx + 1}. ${q}*\n`;
                message += `👉 _Jawaban:_ ${answers[idx] || '(Tidak diisi)'}\n\n`;
            });

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://api.whatsapp.com/send?text=${encodedMessage}`, '_blank');
        }

        function resetQuiz() {
            if (confirm('Yakin mau acak ulang? Semua jawaban saat ini akan terhapus dan 10 pertanyaan baru akan muncul.')) {
                // Hapus data tersimpan
                localStorage.removeItem('quiz_selected_questions');
                localStorage.removeItem('quiz_essay_answers');
                
                // Reset state lokal
                answers = [];
                selectedQuestions = [];
                currentQuestion = 0;
                
                // Kembali ke halaman 1
                document.getElementById('resultScreen').classList.add('hidden');
                document.getElementById('startScreen').classList.remove('hidden');
            }
        }

        // Auto restore if already filled
        window.onload = function() {
            if (userName) {
                document.getElementById('userName').value = userName;
            }
        };
    </script>
</body>
</html>
